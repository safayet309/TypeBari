 <!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নতুন পাসওয়ার্ড — TypeBari</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><span class="logo-mark">T</span>TypeBari</a>
      <nav>
        <a href="login.html">লগইন</a>
      </nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>নতুন পাসওয়ার্ড দিন</h1>
      <p class="sub">নতুন পাসওয়ার্ড লিখে সংরক্ষণ করুন।</p>

      <form id="reset-form" style="display:none" novalidate>
        <label for="password">নতুন পাসওয়ার্ড</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>
        <p class="hint">কমপক্ষে ৬ অক্ষর।</p>

        <label for="confirm-password">পাসওয়ার্ড আবার লিখুন</label>
        <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" minlength="6" required>

        <button type="submit" id="submit-btn" class="button">পাসওয়ার্ড পরিবর্তন করুন</button>
      </form>

      <div id="message" class="message" role="alert"></div>

      <div class="links">
        <p><a href="forgot-password.html">নতুন রিসেট লিংক চান</a></p>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 TypeBari — অনলাইনে টাইপিং সার্ভিস</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/password.js"></script>
</body>
</html>

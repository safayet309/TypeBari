<!DOCTYPE html>
<html lang="bn">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ড্যাশবোর্ড — TypeBari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><span class="logo-mark">T</span>TypeBari</a>
      <nav>
        <a id="admin-link" href="admin/index.html" style="display:none">Admin Panel</a>
        <a class="nav-hide" href="index.html">হোম</a>
        <a href="dashboard.html">ড্যাশবোর্ড</a>
        <a href="my-orders.html">আমার অর্ডার</a>
        <button class="logout" id="logout-btn" type="button">লগআউট</button>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="top-row">
      <div>
        <h1 id="welcome">লোড হচ্ছে...</h1>
        <p class="muted" id="user-email"></p>
      </div>
      <a class="btn-link" href="new-order.html">নতুন অর্ডার দিন</a>
    </div>

    <div id="sub-box"></div>

    <div id="stats" class="stats"></div>

    <div class="page-top">
      <h2 style="margin:0">সাম্প্রতিক অর্ডার</h2>
      <a class="btn-outline" href="my-orders.html">সব অর্ডার দেখুন</a>
    </div>
    <div id="recent-state" class="state">লোড হচ্ছে...</div>
    <div id="recent-list"></div>
  </main>

  <footer>
    <p>© 2026 TypeBari — অনলাইনে টাইপিং সার্ভিস</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/orders.js"></script>
  <script>
    document.getElementById("logout-btn").addEventListener("click", handleLogout);

    (async function () {
      const session = await requireAuth();
      if (!session) return;

      document.getElementById("user-email").textContent = session.user.email;

      const { data: profile } = await sb
        .from("profiles")
        .select("full_name,role")
        .eq("id", session.user.id)
        .maybeSingle();

      const name = (profile && profile.full_name) || session.user.user_metadata.full_name || "";
      document.getElementById("welcome").textContent = name ? "স্বাগতম, " + name : "স্বাগতম";

      if (profile && profile.role === "admin") {
        document.getElementById("admin-link").style.display = "inline";
      }

      loadSubscriptionBox(session.user.id);
      loadCustomerDashboard();
    })();
  </script>
</body>

</html>

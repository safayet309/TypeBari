 <!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লগইন — TypeBari</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><span class="logo-mark">T</span>TypeBari</a>
      <nav>
        <a class="nav-hide" href="index.html">হোম</a>
        <a class="nav-cta" href="register.html">রেজিস্ট্রেশন</a>
      </nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>লগইন</h1>
      <p class="sub">আপনার অ্যাকাউন্টে ঢুকে অর্ডার দেখুন বা নতুন অর্ডার দিন।</p>

      <form id="login-form" novalidate>
        <label for="email">ইমেইল</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>

        <label for="password">পাসওয়ার্ড</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <div id="message" class="message" role="alert"></div>

        <button type="submit" id="submit-btn" class="button">লগইন করুন</button>
      </form>

      <div class="links">
        <p><a href="forgot-password.html">পাসওয়ার্ড ভুলে গেছেন?</a></p>
        <p>অ্যাকাউন্ট নেই? <a href="register.html">রেজিস্ট্রেশন করুন</a></p>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 TypeBari — অনলাইনে টাইপিং সার্ভিস</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

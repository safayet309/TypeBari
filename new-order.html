<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নতুন অর্ডার — TypeBari</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #183b2d; background: #f5faf6; line-height: 1.7; }
    header { padding: 18px 7%; background: white; border-bottom: 1px solid #e0eae3; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .logo { font-size: 25px; font-weight: bold; color: #176b4d; text-decoration: none; }
    nav a { margin-left: 15px; text-decoration: none; color: #183b2d; }
    .auth-wrap { padding: 50px 16px; display: flex; justify-content: center; }
    .auth-card { width: 100%; max-width: 420px; background: white; border: 1px solid #e0eae3; border-radius: 12px; padding: 28px; }
    .auth-card h1 { margin: 0 0 6px; font-size: 26px; }
    .auth-card .sub { margin: 0 0 22px; color: #5d6f64; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; font-size: 15px; }
    input { width: 100%; padding: 11px 12px; border: 1px solid #c9d9ce; border-radius: 8px; font-size: 16px; font-family: inherit; }
    input:focus { outline: 2px solid #176b4d; border-color: #176b4d; }
    .button { display: block; width: 100%; margin-top: 22px; padding: 12px 22px; border: 0; border-radius: 8px; background: #176b4d; color: white; font-size: 16px; cursor: pointer; }
    .button:disabled { opacity: .6; cursor: not-allowed; }
    .message { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 15px; }
    .message.error { display: block; background: #fdecec; color: #a12323; }
    .message.success { display: block; background: #e8f6ee; color: #176b4d; }
    .links { margin-top: 18px; text-align: center; font-size: 15px; }
    .links a { color: #176b4d; }
    .links p { margin: 6px 0; }
    footer { padding: 25px; text-align: center; color: #637469; }
    @media (max-width: 650px) { header { padding: 16px 5%; } nav a { margin-left: 8px; font-size: 14px; } .auth-wrap { padding: 28px 12px; } .auth-card { padding: 22px; } }
    textarea { width: 100%; padding: 11px 12px; border: 1px solid #c9d9ce; border-radius: 8px; font-size: 16px; font-family: inherit; min-height: 140px; resize: vertical; }
    textarea:focus { outline: 2px solid #176b4d; border-color: #176b4d; }
    .hint { margin: 4px 0 0; font-size: 14px; color: #5d6f64; }
    .logout { padding: 9px 18px; border: 1px solid #176b4d; border-radius: 8px; background: white; color: #176b4d; font-size: 15px; cursor: pointer; margin-left: 15px; }
    .auth-card.wide { max-width: 640px; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">TypeBari</a>
    <nav>
      <a href="dashboard.html">ড্যাশবোর্ড</a>
      <button class="logout" id="logout-btn" type="button">লগআউট</button>
    </nav>
  </header>

  <main class="auth-wrap">
    <div class="auth-card wide">
      <h1>নতুন অর্ডার</h1>
      <p class="sub">কী টাইপ করাতে চান তা লিখে জমা দিন। দাম আমরা অর্ডার দেখে জানাব।</p>

      <form id="order-form" novalidate>
        <label for="title">অর্ডারের শিরোনাম</label>
        <input type="text" id="title" name="title" maxlength="120" placeholder="যেমন: ১০ পাতার বাংলা অনুচ্ছেদ টাইপিং" required>

        <label for="instructions">টাইপিংয়ের নির্দেশনা</label>
        <textarea id="instructions" name="instructions" maxlength="5000" placeholder="ভাষা, পাতার সংখ্যা, ফন্ট, ফরম্যাটিং, জমা দেওয়ার সময়সীমা ইত্যাদি লিখুন।" required></textarea>

        <label for="drive-link">Google Drive লিংক (ঐচ্ছিক)</label>
        <input type="url" id="drive-link" name="drive_link" placeholder="https://drive.google.com/...">
        <p class="hint">ফাইল Drive-এ আপলোড করে "লিংকধারী যে কেউ দেখতে পারবে" করে লিংকটি দিন। সরাসরি ফাইল আপলোড পরে যুক্ত হবে।</p>

        <div id="message" class="message" role="alert"></div>

        <button type="submit" id="submit-btn" class="button">অর্ডার জমা দিন</button>
      </form>

      <div class="links">
        <p><a href="dashboard.html">ড্যাশবোর্ডে ফিরে যান</a></p>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 TypeBari — অনলাইনে টাইপিং সার্ভিস</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/orders.js"></script>
  <script>
    document.getElementById("logout-btn").addEventListener("click", handleLogout);

    (async function () {
      const session = await requireAuth();
      if (!session) return;
      document.getElementById("order-form").addEventListener("submit", function (e) {
        handleNewOrder(e, session);
      });
    })();
  </script>
</body>
</html>

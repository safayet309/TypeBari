<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অর্ডারের বিস্তারিত — TypeBari</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><span class="logo-mark">T</span>TypeBari</a>
      <nav>
        <a id="admin-link" href="admin/index.html" style="display:none">Admin Panel</a>
        <a class="nav-hide" href="index.html">হোম</a>
        <a href="dashboard.html">ড্যাশবোর্ড</a>
        <a href="my-orders.html">আমার অর্ডার</a>
        <button class="logout" id="logout-btn" type="button">লগআউট</button>
      </nav>
    </div>
  </header>

  <main class="page">
    <a class="back-link" href="my-orders.html">← আমার অর্ডারে ফিরে যান</a>
    <div id="details-state" class="state">লোড হচ্ছে...</div>
    <div id="details" class="detail-card"></div>
  </main>

  <footer>
    <p>© 2026 TypeBari — অনলাইনে টাইপিং সার্ভিস</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/orders.js"></script>
  <script>
    document.getElementById("logout-btn").addEventListener("click", handleLogout);
    (async function () {
      const session = await requireAuth();
      if (!session) return;
      loadOrderDetails();
    })();
  </script>
</body>
</html>

 <!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>রেজিস্ট্রেশন — TypeBari</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><span class="logo-mark">T</span>TypeBari</a>
      <nav>
        <a class="nav-hide" href="index.html">হোম</a>
        <a href="login.html">লগইন</a>
      </nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>অ্যাকাউন্ট তৈরি করুন</h1>
      <p class="sub">নাম, ইমেইল ও পাসওয়ার্ড দিন। ইমেইল যাচাই লাগবে না।</p>

      <form id="register-form" novalidate>
        <label for="full-name">পূর্ণ নাম</label>
        <input type="text" id="full-name" name="full_name" autocomplete="name" required>

        <label for="email">ইমেইল</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>

        <label for="password">পাসওয়ার্ড</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>
        <p class="hint">কমপক্ষে ৬ অক্ষর।</p>

        <label for="confirm-password">পাসওয়ার্ড আবার লিখুন</label>
        <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" minlength="6" required>

        <div id="message" class="message" role="alert"></div>

        <button type="submit" id="submit-btn" class="button">রেজিস্ট্রেশন করুন</button>
      </form>

      <div class="links">
        <p>আগে থেকেই অ্যাকাউন্ট আছে? <a href="login.html">লগইন করুন</a></p>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 TypeBari — অনলাইনে টাইপিং সার্ভিস</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
